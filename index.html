<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Samarkand</title><link rel="stylesheet" href="base.css">
<style>
nav{position:fixed;top:0;right:0;z-index:20;display:flex;gap:1.6rem;padding:1.2rem 1.6rem;font-size:14px;letter-spacing:.04em}
html,body{overflow-x:clip;max-width:100%}
#hero{position:relative;height:clamp(340px,58svh,560px)}
#sand{position:absolute;inset:0;width:100%;height:100%}
#sub{position:absolute;left:0;right:0;top:72%;text-align:center;font:500 clamp(18px,2.4vw,28px)/1.3 var(--serif);color:var(--mute);letter-spacing:.14em;pointer-events:none}
.hint{position:absolute;bottom:1rem;left:50%;width:1px;height:40px;background:linear-gradient(var(--gold),transparent);animation:hint 2.2s infinite}
@keyframes hint{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
section.s{padding:3rem 1.2rem 3rem;max-width:1300px;margin:auto}
h2{font:500 clamp(34px,5vw,56px)/1.1 var(--serif);text-align:center;letter-spacing:.03em}
.note{text-align:center;color:var(--mute);font-size:13px;margin-top:.4rem}
.work{padding:2.2rem 0 2.6rem}
.work h3{font:500 clamp(28px,4vw,44px)/1.1 var(--serif);text-align:center}
.wcap{text-align:center;font:400 17px/1.65 Manrope,sans-serif;color:#d6d0c1;max-width:680px;margin:.8rem auto 0}
/* --- карточки по порядку --- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1.4rem;align-items:stretch;margin-top:1.6rem}
.cards[data-n="1"]{max-width:820px;margin-inline:auto}.cards[data-n="2"]{max-width:960px;margin-inline:auto}
.card .fdesc{flex:1 1 auto}
.fdesc .ft{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;line-clamp:8;overflow:hidden}
.fdesc .mb{display:none;margin-top:.7rem;color:var(--gold);font:600 14px Manrope,sans-serif;letter-spacing:.02em}
.fdesc.more .mb{display:block}
.card{display:flex;flex-direction:column;gap:.9rem;margin:0;outline:0;-webkit-tap-highlight-color:transparent}
.card[data-z]{cursor:zoom-in}
.cards{position:relative}
.dots{display:none}
.in{position:relative;aspect-ratio:16/9;background:rgba(0,0,0,.4);overflow:hidden;border-radius:3px;border:1px solid rgba(212,175,55,.4);box-shadow:0 14px 34px rgba(0,0,0,.5);transition:transform .35s,border-color .35s,box-shadow .35s}
.in img{width:100%;height:100%;object-fit:var(--fit,cover);display:block;transition:transform .6s}
.in i{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,235,170,.4) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.card:focus-visible .in{border-color:#ffe08a;box-shadow:0 0 0 2px rgba(255,224,138,.6),0 0 30px rgba(255,200,80,.5)}
@media(hover:hover){
 .card[data-z]:hover .in{transform:translateY(-4px);border-color:#ffe08a;box-shadow:0 0 0 1px rgba(255,224,138,.55),0 0 30px rgba(255,200,80,.5),0 20px 50px rgba(0,0,0,.6)}
 .card[data-z]:hover .in img{transform:scale(1.05)}
 .card[data-z]:hover .in i{transform:translateX(120%);transition:transform .9s ease-out}
}
.tag{position:absolute;left:10px;top:10px;z-index:2;padding:.25em .9em;font:600 15px Manrope,sans-serif;color:var(--gold);background:rgba(18,19,21,.8);border:1px solid rgba(212,175,55,.5);border-radius:30px}
/* --- описание: рамка по размеру своего текста, золотая бегущая линия --- */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.fdesc{position:relative;box-sizing:border-box;width:100%;padding:1rem 1.2rem;background:rgba(18,19,21,.8);border:1px solid rgba(212,175,55,.3);border-radius:4px;font:400 16px/1.65 Manrope,sans-serif;color:#f1ece0;white-space:pre-line;
 box-shadow:0 0 18px rgba(212,175,55,.14),inset 0 0 22px rgba(212,175,55,.05);animation:fglow 3.6s ease-in-out infinite}
.fdesc b{display:block;color:var(--gold);font:600 18px/1.4 Manrope,sans-serif;margin-bottom:.4rem}
.fdesc:empty{display:none}
.fdesc::before{content:"";position:absolute;inset:-1px;padding:2px;border-radius:inherit;pointer-events:none;
 background:conic-gradient(from var(--ang),transparent 0 62%,rgba(212,175,55,.35) 80%,#ffe9a0 96%,#fff7d6 100%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
 mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;
 filter:drop-shadow(0 0 5px rgba(255,214,102,.9));animation:fspin 4.2s linear infinite}
@keyframes fspin{to{--ang:360deg}}
@keyframes fglow{50%{box-shadow:0 0 30px rgba(212,175,55,.3),inset 0 0 26px rgba(212,175,55,.09)}}
@media(prefers-reduced-motion:reduce){.fdesc,.fdesc::before{animation:none}}
/* --- видео --- */
#vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:1.6rem;margin-top:2.4rem}
.vc{border:1px solid rgba(212,175,55,.25);padding:.7rem;background:rgba(0,0,0,.18);transition:.4s}
.vc:hover{border-color:var(--gold);box-shadow:0 0 30px rgba(212,175,55,.15)}
.vc video,.vc iframe{width:100%;aspect-ratio:16/9;background:#000;border:0;display:block}
.vc p{font:500 20px var(--serif);margin-top:.6rem}
.wv{max-width:min(92vw,880px);margin:2.2rem auto 0;border:1px solid rgba(212,175,55,.25);padding:.7rem;background:rgba(0,0,0,.18)}
.wv video,.wv iframe{width:100%;aspect-ratio:16/9;background:#000;border:0;display:block}
.wv p{font:500 20px var(--serif);margin-top:.6rem}
footer{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;padding:2rem 1rem 4rem}
/* --- просмотр фото --- */
html.lbo,html.lbo body{overflow:hidden}
#lb{position:fixed;inset:0;z-index:100;display:flex;background:rgba(5,6,8,.95);overscroll-behavior:contain}
#lb[hidden]{display:none}
.lbs{width:100%;height:100%;box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:1rem;padding:calc(env(safe-area-inset-top,0px) + 62px) 14px calc(env(safe-area-inset-bottom,0px) + 22px)}
#lbi{max-width:100%;max-height:calc(100svh - 210px);min-height:120px;object-fit:contain;border:1px solid rgba(212,175,55,.45);box-shadow:0 0 40px rgba(212,175,55,.25);background:rgba(0,0,0,.4)}
#lbd{max-width:780px;flex:none}
#lbd[hidden]{display:none}
#lbt{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 20px);z-index:2;font:600 15px Manrope,sans-serif;color:var(--gold)}
.lbx,.lbn{position:fixed;z-index:3;border:1px solid rgba(212,175,55,.6);background:rgba(18,19,21,.85);color:#ffe9a0;cursor:pointer;font-family:Manrope,sans-serif;-webkit-tap-highlight-color:transparent}
.lbx{top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:48px;height:48px;border-radius:50%;font-size:22px}
.lbn{top:50%;transform:translateY(-50%);width:44px;height:60px;border-radius:6px;font-size:30px;opacity:.85}
.lbn[hidden]{display:none}
#lbp{left:8px}#lbn{right:8px}
.lbx:hover,.lbn:hover{box-shadow:0 0 18px rgba(255,200,80,.6);border-color:#ffe08a}
@media(max-width:700px){
 #hero{height:clamp(280px,44svh,400px)}
 #sub{top:62%}
 section.s{padding:2rem .5rem 1rem}
 .work{padding:1.4rem 0 1.6rem}
 .wcap{font-size:15px;margin-top:.5rem}
 .cards{gap:1.1rem;margin-top:1.1rem}
 .fdesc{padding:.9rem 1rem}
 .wv{margin-top:1.2rem}
 #vgrid{margin-top:1.4rem}
 footer{padding:1.5rem 1rem 3rem}
 .lbn{width:38px;height:52px;opacity:.7}
 .cards,.cards[data-n="1"],.cards[data-n="2"]{display:flex;align-items:stretch;gap:.8rem;max-width:none;margin-inline:-.5rem;padding:.5rem 7vw 2rem;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:7vw;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 .cards::-webkit-scrollbar{display:none}
 .card{flex:0 0 86vw;scroll-snap-align:center;scroll-snap-stop:always;transition:transform .4s,opacity .4s}
 .card:not(.act){opacity:.55;transform:scale(.93)}
 .card.act .in{border-color:#ffe08a;box-shadow:0 0 0 1px rgba(255,224,138,.45),0 0 26px rgba(255,200,80,.4),0 14px 34px rgba(0,0,0,.5)}
 .dots{display:flex;justify-content:center;gap:8px;margin-top:-.6rem}
 .dots b{width:7px;height:7px;border-radius:7px;border:1px solid rgba(212,175,55,.7);transition:.3s}
 .dots b.on{width:22px;background:#ffe08a;border-color:#ffe08a;box-shadow:0 0 10px rgba(255,200,80,.8)}
}
</style></head><body>
<nav id="nav"></nav>
<header id="hero"><canvas id="sand"></canvas><p id="sub"></p><div class="hint"></div></header>
<section class="s" id="gallery"><h2 id="gt"></h2><p class="note" id="demo" hidden>Это демо-блок. Свои фото и видео — в <a href="admin.html">админке</a>.</p>
<p class="note">Нажмите на фото, чтобы открыть его крупно</p><div id="works"></div></section>
<section class="s" id="videos" hidden><h2 id="vt"></h2><div id="vgrid"></div></section>
<footer id="foot"></footer>
<div id="lb" hidden><span id="lbt"></span><button class="lbx" id="lbx" aria-label="Закрыть">✕</button><button class="lbn" id="lbp" aria-label="Назад">‹</button><button class="lbn" id="lbn" aria-label="Вперёд">›</button><div class="lbs"><img id="lbi" alt=""><div class="fdesc" id="lbd" hidden></div></div></div>
<script src="store.js"></script>
<script>
async function getData(){
 if(!location.search.includes('local')){try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});
  if(r.ok){const d=await r.json();return{settings:{fit:'cover',...DEF(),...d.settings},slides:d.slides||[],videos:d.videos||[],links:d.links||[]}}}catch(e){}}
 return loadSite()}
(async()=>{
const D=await getData(),S=D.settings;applyTheme(S);document.title=S.title;
$('#sub').textContent=S.sub;$('#gt').textContent=S.gTitle;$('#vt').textContent=S.vTitle;
/* ---------- золотой песок ---------- */
function sand(){
 const cv=$('#sand'),c=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 let W,H,P=[],G=[],mx=-999,my=-999,t0=performance.now(),run=true;
 const hex=S.gold.replace('#',''),rgb=[0,2,4].map(i=>parseInt(hex.substr(i,2),16));
 const pal=[-.45,-.2,0,.25,.55].map(f=>'rgb('+rgb.map(v=>Math.round(f<0?v*(1+f):v+(255-v)*f)).join()+')');
 function build(){
  const r=cv.parentNode.getBoundingClientRect();W=Math.floor(r.width);H=Math.floor(r.height);cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);
  const o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');
  let fs=Math.min(W/(S.title.length*.5),H*.42),f=()=>x.font=`600 ${fs}px "Cormorant Garamond",Georgia,serif`;f();
  const w=x.measureText(S.title).width;if(w>W*.9){fs*=W*.9/w;f()}
  x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText(S.title,W/2,H*.42);
  const gap=Math.max(2,(W<700?3.4:2.5)/S.sand),d=x.getImageData(0,0,W,H).data,T=[];
  for(let y=0;y<H;y+=gap)for(let X=0;X<W;X+=gap){const px=X+Math.random()*gap|0,py=y+Math.random()*gap|0;if(d[(py*W+px)*4+3]>128)T.push([px,py])}
  P=T.map((q,i)=>{const p=P[i]||{x:q[0]+(Math.random()-.5)*80,y:-Math.random()*H*.7-20,vx:0,vy:0};
   Object.assign(p,{tx:q[0],ty:q[1],k:Math.floor(Math.random()*5),s:1.2+Math.random()*1.3,ph:Math.random()*6.28,dl:calm?0:(q[0]/W)*.9+Math.random()*.7});
   if(calm){p.x=q[0];p.y=q[1]}return p});
  G=Array.from({length:Math.round(W/12)},()=>({x:Math.random()*W,y:Math.random()*H,v:.15+Math.random()*.4,s:.8+Math.random()*1.2,k:Math.floor(Math.random()*5)}));
 }
 function frame(now){
  if(!run)return;const t=(now-t0)/1000;c.clearRect(0,0,W,H);
  const B=[[],[],[],[],[]];
  for(const p of P){
   if(t>p.dl){const dx=p.tx-p.x,dy=p.ty-p.y;p.vx+=dx*.018;p.vy+=dy*.018;p.vx*=.86;p.vy*=.86}else p.vy+=.35;
   const mdx=p.x-mx,mdy=p.y-my,m=mdx*mdx+mdy*mdy;if(m<9000){const q=Math.sqrt(m)||1,f=(95-q)/95*3.2;p.vx+=mdx/q*f;p.vy+=mdy/q*f}
   p.x+=p.vx;p.y+=p.vy;B[p.k].push(p.x+Math.sin(t*2+p.ph)*.35,p.y+Math.cos(t*1.7+p.ph)*.35,p.s)}
  for(const g of G){g.y+=g.v;g.x+=Math.sin(t+g.y*.02)*.2;if(g.y>H){g.y=-4;g.x=Math.random()*W}B[g.k].push(g.x,g.y,g.s*.8)}
  c.globalAlpha=1;B.forEach((a,k)=>{c.fillStyle=pal[k];for(let i=0;i<a.length;i+=3)c.fillRect(a[i],a[i+1],a[i+2],a[i+2])});
  requestAnimationFrame(frame)}
 const hero=cv.parentNode;
 hero.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
 hero.addEventListener('pointerleave',()=>mx=my=-999);
 new IntersectionObserver(([e])=>{if(e.isIntersecting&&!run){run=true;requestAnimationFrame(frame)}else if(!e.isIntersecting)run=false}).observe(hero);
 let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(build,200)});
 (document.fonts?document.fonts.load('600 80px "Cormorant Garamond"').catch(()=>{}):Promise.resolve()).then(()=>{build();requestAnimationFrame(frame)});
}
sand();
/* ---------- блоки: A — оригинал — B, ниже видео, дальше вниз ---------- */
const svg=(h,t)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},35%,38%)"/><stop offset="1" stop-color="hsl(${h+30},40%,12%)"/></linearGradient></defs><rect width="960" height="540" fill="url(#g)"/><circle cx="480" cy="240" r="100" fill="none" stroke="#d4af37" stroke-width="2"/><text x="480" y="470" fill="#d4af37" font-family="Georgia" font-size="40" text-anchor="middle">${t}</text></svg>`);
const demo=!D.slides.length;
const slides=demo?[{title:'Демо-блок',caption:'Слева вариант A, по центру оригинал, справа вариант B. Нажмите на фото, чтобы открыть его крупно.',left:svg(200,'Вариант A'),orig:svg(35,'Оригинал'),right:svg(300,'Вариант B')}]:D.slides;
$('#demo').hidden=!demo;
function mkVid(v){const d=document.createElement('div');d.className='wv';const em=v.url&&embed(v.url);
 if(em)d.innerHTML=`<iframe src="${em}" allowfullscreen loading="lazy"></iframe>`;
 else{const el=document.createElement('video');el.controls=true;el.preload='metadata';el.playsInline=true;el.src=U(v.blob)||v.url;
  el.onerror=()=>{const a=document.createElement('a');a.href=el.src;a.download=v.title||'video';a.textContent='Формат не воспроизводится в браузере — скачать файл';a.style.cssText='display:block;padding:2rem;text-align:center';el.replaceWith(a)};d.append(el)}
 if(v.title)d.insertAdjacentHTML('beforeend',`<p>${esc(v.title)}</p>`);return d}
const fmt=t=>{t=(t||'').trim();const [a,...b]=t.split('\n'),rest=b.join('\n').trim();return !t?'':rest?`<b>${esc(a)}</b>${esc(rest)}`:esc(a)};
/* ---------- просмотр фото (кнопка «назад» на телефоне закрывает его, а не сайт) ---------- */
const lb=$('#lb'),lbi=$('#lbi'),lbd=$('#lbd');let L=[],li=0,lbOpen=false;
function showLB(){const it=L[li];lbi.src=it.src;$('#lbt').textContent=it.tag+(L.length>1?'  ·  '+(li+1)+' / '+L.length:'');lbd.innerHTML=fmt(it.d);lbd.hidden=!it.d;$('#lbp').hidden=$('#lbn').hidden=L.length<2;$('.lbs',lb).scrollTop=0}
function openLB(list,i){L=list;li=i;showLB();lb.hidden=false;document.documentElement.classList.add('lbo');
 if(!lbOpen){lbOpen=true;try{history.pushState({lb:1},'')}catch(e){}}}
function hideLB(){lb.hidden=true;lbi.removeAttribute('src');document.documentElement.classList.remove('lbo');lbOpen=false}
function closeLB(){if(!lbOpen)return;if(history.state&&history.state.lb)history.back();else hideLB()}
const stepLB=d=>{if(L.length>1){li=(li+d+L.length)%L.length;showLB()}};
addEventListener('popstate',()=>{if(lbOpen)hideLB()});
$('#lbx').onclick=closeLB;$('#lbp').onclick=()=>stepLB(-1);$('#lbn').onclick=()=>stepLB(1);
lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('lbs'))closeLB()});
addEventListener('keydown',e=>{if(!lbOpen)return;if(e.key==='Escape')closeLB();else if(e.key==='ArrowLeft')stepLB(-1);else if(e.key==='ArrowRight')stepLB(1)});
let tx=null,ty=0;lb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
lb.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5)stepLB(dx<0?1:-1)},{passive:true});
/* ---------- работы: Вариант A — Оригинал — Вариант B по порядку ---------- */
slides.forEach(s=>{
 const w=document.createElement('article');w.className='work';
 const items=[['left','ll','Вариант A'],['orig','ol','Оригинал'],['right','rl','Вариант B']].map(([k,l,tag])=>({src:s[k]?U(s[k]):'',d:((s[l]||'').trim().toLowerCase()===tag.toLowerCase()?'':(s[l]||'').trim()),tag})).filter(i=>i.src||i.d);
 const list=items.filter(i=>i.src);
 w.innerHTML=(s.title?`<h3>${esc(s.title)}</h3>`:'')+(s.caption?`<p class="wcap">${esc(s.caption)}</p>`:'')+
  `<div class="cards" data-n="${items.length}">`+items.map(it=>`<figure class="card"${it.src?' data-z tabindex="0"':''}><div class="in">${it.src?`<img src="${it.src}" alt="" loading="lazy" draggable="false">`:''}<span class="tag">${it.tag}</span><i></i></div>${it.d?`<div class="fdesc"><div class="ft">${fmt(it.d)}</div>${it.src?'<span class="mb">Читать полностью →</span>':''}</div>`:''}</figure>`).join('')+'</div>';
 $$('.card',w).forEach((c,i)=>{if(!items[i].src)return;const o=()=>openLB(list,list.indexOf(items[i]));c.onclick=o;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();o()}}});
 if(s.vid||s.vurl)w.append(mkVid({blob:s.vid,url:s.vurl,title:s.vtitle}));
 $('#works').append(w);
 const chk=()=>$$('.fdesc',w).forEach(f=>{const t=$('.ft',f);f.classList.toggle('more',!!t&&t.scrollHeight>t.clientHeight+1)});
 chk();addEventListener('resize',chk);(document.fonts?document.fonts.ready:Promise.resolve()).then(chk);
 const cs=$('.cards',w),cd=$$('.card',w);
 if(cd.length>1){const dots=document.createElement('div');dots.className='dots';dots.innerHTML=cd.map(()=>'<b></b>').join('');cs.after(dots);
  const act=()=>{const m=cs.scrollLeft+cs.clientWidth/2;let bi=0,bd=1e9;cd.forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-m);if(d<bd){bd=d;bi=i}});
   cd.forEach((c,i)=>c.classList.toggle('act',i===bi));$$('b',dots).forEach((b,i)=>b.classList.toggle('on',i===bi))};
  let tk;cs.addEventListener('scroll',()=>{if(!tk)tk=requestAnimationFrame(()=>{tk=0;act()})},{passive:true});addEventListener('resize',act);act()}
 });
/* ---------- видео ---------- */
if(D.videos.length){$('#videos').hidden=false;
 $('#vgrid').append(...D.videos.map(v=>{const d=document.createElement('div');d.className='vc';const em=v.url&&embed(v.url);
  if(em)d.innerHTML=`<iframe src="${em}" allowfullscreen loading="lazy"></iframe>`;
  else{const el=document.createElement('video');el.controls=true;el.preload='metadata';el.playsInline=true;el.src=U(v.blob)||v.url;
   el.onerror=()=>{const a=document.createElement('a');a.href=el.src;a.download=v.title||'video';a.textContent='Формат не воспроизводится в браузере — скачать файл';a.style.cssText='display:block;padding:2rem;text-align:center';el.replaceWith(a)};d.append(el)}
  d.insertAdjacentHTML('beforeend',`<p>${esc(v.title)}</p>`);return d}))}
/* ---------- навигация и ссылки ---------- */
$('#nav').innerHTML=`<a href="#gallery">${esc(S.gTitle)}</a>`+(D.videos.length?`<a href="#videos">${esc(S.vTitle)}</a>`:'');
$('#foot').innerHTML=D.links.map(l=>`<a class="btn" href="${esc(l.url)}"${l.blank===false?'':' target="_blank" rel="noopener"'}>${esc(l.label||l.url)}</a>`).join('');
})();
</script></body></html>
